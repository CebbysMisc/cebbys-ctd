[project]
name = "cebbys-ctd-loader"
version = "0.1.0"
description = "Main loader for CTD language"
requires-python = ">=3.13"
dependencies = [
    "cebbys-ctd-resolver",
    "cebbys-ctd-meta",
    "cebbys-ctd-types",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sources/lv"]

[tool.uv.sources]
cebbys-ctd-resolver = { workspace = true }
cebbys-ctd-meta = { workspace = true }
cebbys-ctd-types = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["sources"]

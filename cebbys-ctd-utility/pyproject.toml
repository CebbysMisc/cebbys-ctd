[project]
name = "cebbys-ctd-utility"
version = "0.1.0"
description = "Utility classes and scripts for CTD language"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sources/lv"]

[tool.pytest.ini_options]
pythonpath = ["sources", "tests", ".."]

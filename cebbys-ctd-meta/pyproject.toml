[project]
name = "cebbys-ctd-meta"
version = "0.1.0"
description = "Meta loading for CTD language"
requires-python = ">=3.13"
dependencies = [
    "cebbys-ctd-antlr4",
    "cebbys-ctd-types",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sources/lv"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv.sources]
cebbys-ctd-antlr4 = { path = "../cebbys-ctd-antlr4" }
cebbys-ctd-types = { path = "../cebbys-ctd-types" }

[tool.pytest.ini_options]
pythonpath = ["sources", "tests"]

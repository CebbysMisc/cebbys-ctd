[project]
name = "cebbys-ctd-meta"
version = "0.1.0"
description = "Meta loading for CTD language"
requires-python = ">=3.13"
dependencies = [
    "cebbys-ctd-antlr4",
    "cebbys-ctd-types",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sources/lv"]

[tool.uv.sources]
cebbys-ctd-antlr4 = { workspace = true }
cebbys-ctd-types = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["sources", "tests", ".."]
